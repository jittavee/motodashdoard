name: Deploy to Firebase App Distribution

on:
  push:
    branches:
      - 'release/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvmrc
        run: echo "flutter_version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.flutter_version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Write google-services.json
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build release APK
        run: flutter build apk --release

      - name: Setup Node (for firebase-tools)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          firebase appdistribution:distribute \
            "build/app/outputs/flutter-apk/app-release.apk" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$(echo "$RELEASE_NOTES" | head -n1)" \
            --groups "tester" \
            --token "$FIREBASE_TOKEN"
